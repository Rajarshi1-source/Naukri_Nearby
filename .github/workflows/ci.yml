name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: naukrinearby
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build + test (Testcontainers uses the Docker daemon on the runner)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  resume-eval-gate:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Optional quality gate: runs the resume-extraction eval against a stub-backed app and
    # fails the build on regression vs eval/baseline.json. Uses the offline stub provider so
    # no API key is required in CI; point EXTRACTION_PROVIDER at the real model for a true gate.
    env:
      EVAL_ENABLED: 'true'
      EVAL_API_KEY: ci-eval-key
      EXTRACTION_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start infra
        run: docker compose -f naukrinearby/compose.yaml up -d
      - name: Boot app
        working-directory: naukrinearby
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bootJar -x test
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break || sleep 5
          done
      - name: Run eval gate
        working-directory: naukrinearby/eval
        env:
          NAUKRI_BASE_URL: http://localhost:8080
        run: |
          pip install -r requirements.txt
          python run_eval.py --ci
