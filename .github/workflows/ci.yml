name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job: CI only reads the repository (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: naukrinearby
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build + test (Testcontainers uses the Docker daemon on the runner)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  resume-eval-gate:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Optional quality gate: runs the resume-extraction eval against a stub-backed app and
    # fails the build on regression vs eval/baseline.json. Uses the offline stub provider so
    # no API key is required in CI; point EXTRACTION_PROVIDER at the real model for a true gate.
    env:
      EVAL_ENABLED: 'true'
      EVAL_API_KEY: ci-eval-key
      EXTRACTION_PROVIDER: stub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start infra
        run: docker compose -f naukrinearby/compose.yaml up -d
      - name: Boot app
        working-directory: naukrinearby
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bootJar -x test
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health && break || sleep 5   # actuator is on the management port
          done
      - name: Run eval gate
        working-directory: naukrinearby/eval
        env:
          NAUKRI_BASE_URL: http://localhost:8080
        run: |
          pip install -r requirements.txt
          python run_eval.py --ci

  e2e:
    runs-on: ubuntu-latest
    needs: [build-and-test, test-frontend]
    # Playwright against the real stack: Compose infra + the backend jar + a production `next start`
    # (the service worker only registers in production builds). Nothing is mocked.
    env:
      NAUKRI_ADMIN_PHONES: '9000000001'
      E2E_ADMIN_PHONE: '9000000001'
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start infra
        run: docker compose -f naukrinearby/compose.yaml up -d --wait
      - name: Boot API
        working-directory: naukrinearby
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bootJar -x test
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health/readiness && break || sleep 5
          done
      - name: Build and start the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break || sleep 2; done
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload report and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/next.log
            naukrinearby/app.log
          retention-days: 7
