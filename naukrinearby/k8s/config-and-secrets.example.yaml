# Example non-secret config + secret skeleton. Copy, fill in, and apply BEFORE the deployments.
# NEVER commit real secret values — use a sealed-secret / external secrets operator in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: naukrinearby-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/naukrinearby"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_ELASTICSEARCH_URIS: "http://elasticsearch:9200"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "resumes"
  STORAGE_ENCRYPTION: "sse"
  CORS_ALLOWED_ORIGINS: "https://app.naukrinearby.example"
  SEARCH_RANKING: "hybrid"
  # Real adapters on in prod; flip these to the live providers once keys are in the Secret.
  EXTRACTION_PROVIDER: "gpt5mini"
  EMBEDDING_PROVIDER: "remote"
  TRANSLATION_PROVIDER: "bhashini"
  TWILIO_PROVIDER: "twilio"
  OTP_PROVIDER: "twilio"
---
apiVersion: v1
kind: Secret
metadata:
  name: naukrinearby-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: ""
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
  LLM_API_KEY: ""
  EMBEDDING_API_KEY: ""
  BHASHINI_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_VERIFY_SERVICE_SID: ""
