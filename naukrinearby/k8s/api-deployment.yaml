# API deployment: stateless request-serving pods. Workers are disabled here via the `api` profile
# (see OutboxSyncWorker/NotificationScheduler @Profile("!api")), so API and workers scale independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naukrinearby-api
  labels: { app: naukrinearby, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: naukrinearby, tier: api }
  template:
    metadata:
      labels: { app: naukrinearby, tier: api }
      annotations:
        # Prometheus scrapes the pod directly on the internal management port; the Service never exposes it.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api
          image: naukrinearby/app:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management   # actuator: probes + metrics (internal only)
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "api"
          envFrom:
            - configMapRef: { name: naukrinearby-config }
            - secretRef: { name: naukrinearby-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: naukrinearby-api
spec:
  selector: { app: naukrinearby, tier: api }
  ports:
    - port: 80
      targetPort: http   # API only: the management port (8081) is deliberately NOT exposed
---
# Scale API on CPU; request volume is the dominant driver for the stateless tier.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: naukrinearby-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: naukrinearby-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
