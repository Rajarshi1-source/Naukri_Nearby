spring:
  application:
    name: naukrinearby
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/naukrinearby}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 3s
  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Resilience4j: circuit breakers + retry-with-backoff for external calls (master plan §12).
# Timeouts are set on each provider's RestClient (LLM 60s, Twilio 10s, Bhashini 10s, embeddings 30s);
# Elasticsearch (3s socket timeout) degrades to a PostGIS fallback in SearchService.
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      llm: { baseConfig: default }
      bhashini: { baseConfig: default }
      twilio: { baseConfig: default }
      embedding: { baseConfig: default }
      elasticsearch: { baseConfig: default }
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
    instances:
      llm: { baseConfig: default }
      bhashini: { baseConfig: default }
      twilio: { baseConfig: default }
      embedding: { baseConfig: default }

naukri:
  jwt:
    issuer: naukrinearby
    access-ttl: 15m
    refresh-ttl: 30d
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  otp:
    provider: ${OTP_PROVIDER:stub}
    dev-code: ${OTP_DEV_CODE:123456}
    ttl: 5m
    max-per-hour: 5
  llm:
    extraction-provider: ${EXTRACTION_PROVIDER:gpt5mini}
    extraction-model: ${EXTRACTION_MODEL:gpt-5-mini}
    vision-model: ${VISION_MODEL:gpt-5-mini}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    temperature: 0.0
    timeout: 60s
  vision:
    provider: ${VISION_PROVIDER:stub}
  embedding:
    provider: ${EMBEDDING_PROVIDER:local}
    model: ${EMBEDDING_MODEL:bge-m3}
    dims: ${EMBEDDING_DIMS:1024}
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
  translation:
    provider: ${TRANSLATION_PROVIDER:stub}
    base-url: ${BHASHINI_BASE_URL:}
    api-key: ${BHASHINI_API_KEY:}
    timeout: 10s
  twilio:
    provider: ${TWILIO_PROVIDER:stub}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    public-webhook-url: ${TWILIO_WEBHOOK_URL:http://localhost:8080/api/webhooks/twilio}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:resumes}
    encryption: ${STORAGE_ENCRYPTION:none}
    signed-url-ttl: 15m
  ratelimit:
    api-per-minute: ${API_RATE_LIMIT_PER_MINUTE:100}
  search:
    index: jobs
    cache-ttl: 5m
    max-results: 20
    ranking: ${SEARCH_RANKING:geo}
    rrf-window: 50
    rrf-k: 60
  notification:
    daily-limit: 3
    match-threshold: 0.6
    stream: notification-jobs
    dlq-stream: notification-dlq
    consumer-group: notifiers
    consumer-name: worker-1
  geo:
    min-lat: 6.5
    max-lat: 37.5
    min-lng: 68.0
    max-lng: 97.5
    max-radius-km: 100
    geocoder: ${GEOCODER:none}
    geocoder-base-url: ${GEOCODER_BASE_URL:https://nominatim.openstreetmap.org}
  eval:
    enabled: ${EVAL_ENABLED:false}
    api-key: ${EVAL_API_KEY:}
    trace-enabled: ${EVAL_TRACE_ENABLED:false}
