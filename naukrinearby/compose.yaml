services:
  postgres:
    build: ./docker/postgres
    image: naukrinearby/postgres:16
    environment:
      - POSTGRES_DB=naukrinearby
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7-alpine'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:9.4.5'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5

  # S3-compatible object storage for resumes (see ADR 0006). RustFS replaced MinIO, whose community
  # images were withdrawn from Docker Hub in Sept 2026. The app still talks to it with the MinIO Java
  # SDK and the MINIO_* settings, since both are plain S3 clients/config and the wire API is unchanged.
  rustfs:
    image: 'rustfs/rustfs:1.0.1'
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
      # Set to a base64-encoded 32-byte key to allow SSE-S3 (STORAGE_ENCRYPTION=sse).
      - RUSTFS_SSE_S3_MASTER_KEY=${RUSTFS_SSE_S3_MASTER_KEY:-}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Next.js frontend (lean MVP). Opt-in via the `frontend` profile. The Spring Boot app runs on
  # the host (gradle bootRun / bootJar), so the browser reaches it at NEXT_PUBLIC_API_URL. ---
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    profiles: ['frontend']
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # --- Observability stack (master plan §16). Scrapes the app's Actuator/Prometheus endpoint. ---
  prometheus:
    image: 'prom/prometheus:v2.54.1'
    profiles: ['observability']
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: 'grafana/grafana:11.2.0'
    profiles: ['observability']
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- LLM observability (Langfuse) — traces resume-extraction calls. Needs its own Postgres. ---
  langfuse-db:
    image: 'postgres:16-alpine'
    profiles: ['observability']
    environment:
      - POSTGRES_DB=langfuse
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse:
    image: 'langfuse/langfuse:2'
    profiles: ['observability']
    ports:
      - '3002:3000'
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=change-me-langfuse
      - SALT=change-me-salt
      - TELEMETRY_ENABLED=false
    depends_on:
      - langfuse-db

volumes:
  postgres_data:
  redis_data:
  es_data:
  rustfs_data:
  grafana_data:
  langfuse_db_data:
